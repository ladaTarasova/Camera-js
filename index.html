<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Canvas Lab — всё в одном файле</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 18px;
            font-weight: 500;
            margin: 0;
        }

        .stage {
            position: relative;
            width: 320px;
            height: 480px;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        video {
            display: none;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #overlay {
            pointer-events: none;
        }

        #hint {
            font-size: 13px;
            color: #aaa;
            text-align: center;
            max-width: 340px;
            line-height: 1.5;
            display: none;
        }

        #status {
            font-size: 13px;
            color: #00ffb4;
            min-height: 18px;
        }

        .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, .6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #0f0;
        }
    </style>
</head>

<body>

    <h1>Canvas + MediaPipe Hands</h1>

    <div class="stage">
        <video></video>
        <canvas id="videoCanvas"></canvas>
        <canvas id="overlay"></canvas>
        <div class="badge" id="badge">ожидание камеры…</div>
    </div>

    <p id="status"></p>
    <p id="hint">
        Наведите указательный палец на кнопку и сведите большой и указательный пальцы (щипок) — кнопка нажмётся.
    </p>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <script>
        const video$ = document.querySelector("video");
        const canvas$ = document.getElementById("videoCanvas");
        const ctx = canvas$.getContext("2d");

        const WIDTH = 320;
        const HEIGHT = 480;
        canvas$.width = WIDTH;
        canvas$.height = HEIGHT;

        const constraints = { audio: false, video: { width: WIDTH, height: HEIGHT } };

        const overlay$ = document.getElementById("overlay");
        const octx = overlay$.getContext("2d");
        overlay$.width = WIDTH;
        overlay$.height = HEIGHT;

        let lastHand = null;
        const cursor = { x: WIDTH / 2, y: HEIGHT / 2, visible: false };

        const button = { x: 110, y: 380, w: 100, h: 60, pressed: false };
        let pinchWasActive = false;

        const badge$ = document.getElementById("badge");
        const status$ = document.getElementById("status");

        navigator.mediaDevices
            .getUserMedia(constraints)
            .then((stream) => {
                video$.srcObject = stream;
                video$.onloadedmetadata = () => {
                    video$.play();
                    badge$.textContent = "камера OK";
                    startHandDetection();          
                    requestAnimationFrame(drawVideoFrame);
                };
            })
            .catch((err) => {
                console.error(err);
                badge$.textContent = "нет доступа к камере";
                status$.textContent = "Ошибка: " + err.message;
            });

        function drawVideoFrame() {
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(video$, -WIDTH, 0, WIDTH, HEIGHT);
            ctx.restore();


            octx.clearRect(0, 0, WIDTH, HEIGHT);

            drawCursor(lastHand);     
            drawButton(lastHand);     

            requestAnimationFrame(drawVideoFrame);
        }

        const hands = new Hands({
            locateFile: (file) =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6,
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                lastHand = {
                    landmarks: results.multiHandLandmarks[0], 
                    handedness: results.multiHandedness[0].label,
                };
                badge$.textContent = "рука: " + lastHand.handedness;
            } else {
                lastHand = null;
                badge$.textContent = "рука не найдена";
            }
        });

        let camera = null;
        function startHandDetection() {
            camera = new Camera(video$, {
                onFrame: async () => { await hands.send({ image: video$ }); },
                width: WIDTH,
                height: HEIGHT,
            });
            camera.start();
        }

        function drawCursor(hand) {
            cursor.visible = false;
            if (!hand) return;

            const tip = hand.landmarks[8];
            const x = (1 - tip.x) * WIDTH; 
            const y = tip.y * HEIGHT;

            cursor.x = x;
            cursor.y = y;
            cursor.visible = true;

            octx.beginPath();
            octx.arc(x, y, 14, 0, Math.PI * 2);
            octx.fillStyle = "rgba(0,255,180,0.30)";
            octx.fill();
            octx.lineWidth = 2;
            octx.strokeStyle = "#00ffb4";
            octx.stroke();

            octx.beginPath();
            octx.moveTo(x - 6, y); octx.lineTo(x + 6, y);
            octx.moveTo(x, y - 6); octx.lineTo(x, y + 6);
            octx.stroke();
        }

        function getPinch(hand) {
            if (!hand) return { active: false, distance: Infinity };
            const thumb = hand.landmarks[4]; 
            const index = hand.landmarks[8]; 
            const distance = Math.hypot(thumb.x - index.x, thumb.y - index.y);
            const active = distance < 0.05;
            return { active, distance };
        }

        function drawButton(hand) {
            const pinch = getPinch(hand);

            const hover =
                cursor.visible &&
                cursor.x > button.x &&
                cursor.x < button.x + button.w &&
                cursor.y > button.y &&
                cursor.y < button.y + button.h;

            if (pinch.active && hover && !pinchWasActive) {
                button.pressed = true;
                status$.textContent = "Кнопка нажата!";
                console.log("Кнопка нажата (pinch)");

                canvas$.style.outline = "3px solid #ff5252";
                setTimeout(() => (canvas$.style.outline = "none"), 250);
            }
            if (!pinch.active) {
                button.pressed = false;
            }
            pinchWasActive = pinch.active;

            octx.fillStyle = button.pressed ? "#ff5252" : hover ? "#3a8dff" : "#2a2a2a";
            octx.fillRect(button.x, button.y, button.w, button.h);

            octx.strokeStyle = "#fff";
            octx.lineWidth = 2;
            octx.strokeRect(button.x, button.y, button.w, button.h);

            octx.fillStyle = "#fff";
            octx.font = "16px system-ui, sans-serif";
            octx.textAlign = "center";
            octx.textBaseline = "middle";
            octx.fillText("Кнопка", button.x + button.w / 2, button.y + button.h / 2);
        }

        window.addEventListener("load", () => {
            console.log("[lab] index.html загружен. Разрешите камеру.");
        });
    </script>

</body>

</html>
